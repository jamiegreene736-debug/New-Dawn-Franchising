name: CI

# Validates every change: type-checks and builds the client + server.
# This does NOT deploy — Railway remains the deploy path. It just gives each
# PR / push to main an automatic green/red check.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    env:
      # CI only type-checks and builds — skip heavy browser binaries that the
      # e2e tooling would otherwise download on install.
      CYPRESS_INSTALL_BINARY: "0"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run check

      - name: Mobile foundation and security tests
        run: npm run test:mobile-foundation

      - name: Build (client + server)
        run: npm run build
