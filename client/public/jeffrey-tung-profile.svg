<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Jeffrey Tung profile card</title>
  <desc id="desc">Branded profile tile for Jeffrey Tung, SMB operations and private equity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbf7"/>
      <stop offset="0.55" stop-color="#e8f0e6"/>
      <stop offset="1" stop-color="#d8e4d5"/>
    </linearGradient>
    <linearGradient id="band" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0e3328"/>
      <stop offset="1" stop-color="#1f5a44"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#0e3328" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="1000" cy="180" r="260" fill="#d7c58a" opacity="0.28"/>
  <circle cx="170" cy="260" r="180" fill="#0e3328" opacity="0.08"/>
  <rect x="180" y="150" width="840" height="720" rx="54" fill="#ffffff" opacity="0.82" filter="url(#shadow)"/>
  <circle cx="600" cy="450" r="205" fill="#0e3328" opacity="0.08"/>
  <text x="600" y="545" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="260" font-weight="700" fill="#0e3328">JT</text>
  <rect x="0" y="890" width="1200" height="310" fill="url(#band)"/>
  <text x="600" y="1010" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="4" fill="#ffffff">JEFFREY TUNG</text>
  <text x="600" y="1090" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="2" fill="#d7c58a">SMB OPERATIONS + PRIVATE EQUITY</text>
</svg>
