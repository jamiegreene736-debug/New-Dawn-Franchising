name: CI

# Validates every change: type-checks and builds the client + server.
# This does NOT deploy — Railway remains the deploy path. It just gives each
# PR / push to main an automatic green/red check.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    env:
      # CI only type-checks and builds — skip heavy browser binaries that the
      # e2e tooling would otherwise download on install.
      CYPRESS_INSTALL_BINARY: "0"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install mobile dependencies
        run: npm ci --prefix mobile --no-audit --no-fund

      - name: Production dependency audit
        run: npm run audit:production

      - name: Mobile production dependency audit
        run: npm audit --prefix mobile --omit=dev --audit-level=high

      - name: Type-check
        run: npm run check

      - name: Mobile foundation and security tests
        run: npm run test:mobile-foundation

      - name: Verify iOS app
        run: npm run verify --prefix mobile

      - name: Export connected iOS bundle
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_APP_MODE: connected
          EXPO_PUBLIC_API_BASE_URL: https://new-dawn-mobile-staging-staging.up.railway.app
        run: npx expo export --platform ios

      - name: Verify mobile-only migration boundary
        run: npm run mobile:migration:verify

      - name: Build (client + server)
        run: npm run build
