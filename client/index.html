      fetch('/api/config/ga').then(r=>r.json()).then(d=>{
        if(!d.id)return;
        var s=document.createElement('script');
        s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+d.id;

        window.gtag=gtag;
        gtag('js',new Date());gtag('config',d.id);
      }).catch(function(){});
