  <body>
    <div id="root"></div>
    <script>
      fetch('/api/config/ga').then(r=>r.json()).then(d=>{
        if(!d.id)return;
        var s=document.createElement('script');
        s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+d.id;
        document.head.appendChild(s);
        window.dataLayer=window.dataLayer||[];
        function gtag(){dataLayer.push(arguments);}
        window.gtag=gtag;
        gtag('js',new Date());gtag('config',d.id);
      }).catch(function(){});
    </script>
    <script type="module" src="/src/main.tsx"></script>
